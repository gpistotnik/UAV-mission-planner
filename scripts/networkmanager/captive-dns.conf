# /etc/NetworkManager/dnsmasq-shared.d/captive.conf
#
# DNS hijack za captive-portal probe domene. NetworkManager v shared
# nacinu (``ipv4.method=shared``) avtomatsko zaganja dnsmasq instanco
# za vsako AP omrezje; ta datoteka je dodatna konfiguracija, ki jo
# dnsmasq prebere ob startup-u.
#
# Sintaksa: address=/<domena>/<IP>
# Pomeni: za domeno IN VSE PODDOMENE vrni dani IP.
#
# Naslov 10.0.0.1 je IP RPi-ja na AP omrezju (glej setup_ap.sh).
# Django na :80 (core.captive) vrne 302 na http://dron.local/nadzor/.

# iOS / macOS
address=/captive.apple.com/10.0.0.1
address=/apple.com/10.0.0.1
address=/icloud.com/10.0.0.1

# Android (vse pogoste verzije)
address=/connectivitycheck.gstatic.com/10.0.0.1
address=/connectivitycheck.android.com/10.0.0.1
address=/clients3.google.com/10.0.0.1
address=/clients4.google.com/10.0.0.1
address=/play.googleapis.com/10.0.0.1

# Windows 10 / 11
address=/www.msftconnecttest.com/10.0.0.1
address=/www.msftncsi.com/10.0.0.1
address=/dns.msftncsi.com/10.0.0.1
address=/ipv6.msftconnecttest.com/10.0.0.1

# Linux / NetworkManager / GNOME / KDE
address=/nmcheck.gnome.org/10.0.0.1
address=/network-test.debian.org/10.0.0.1
address=/connectivity-check.ubuntu.com/10.0.0.1
address=/conncheck.opensuse.org/10.0.0.1

# Firefox
address=/detectportal.firefox.com/10.0.0.1

# Friendly host names za drono (tudi ce mDNS ne dela)
address=/dron/10.0.0.1
address=/dron.local/10.0.0.1
address=/dron01/10.0.0.1
address=/dron01.local/10.0.0.1
