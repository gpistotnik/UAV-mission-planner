[pytest]
DJANGO_SETTINGS_MODULE = missionplanner.settings
python_files = test_*.py
# Testi so funkcije; brez tega bi pytest poskusal zbirati
# produkcijske razrede TestFlightRunner in TestFlightParams.
python_classes =
testpaths = missions/tests analysis
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
