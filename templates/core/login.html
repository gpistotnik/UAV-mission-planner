{% extends "base.html" %}
{% load i18n_simple %}


{% block title %}{% t "login.title" %}{% endblock %}

{% block content %}
  <h2>{% t "login.heading" %}</h2>
  <p style="max-width:44em;color:#555;">

      {% t "login.intro" %}

  </p>

  {% if form.errors %}
    <p style="color:#b91c1c;">{% t "login.error_invalid" %}</p>
  {% endif %}

  <form method="post" style="max-width:22em;display:grid;gap:10px;">
    {% csrf_token %}
    <label>{% t "login.username" %}
      <input type="text" name="username" autofocus required
             style="width:100%;padding:6px;">
    </label>
    <label>{% t "login.password" %}
      <input type="password" name="password" required style="width:100%;padding:6px;">
    </label>
    <button type="submit"
            style="background:#1f6feb;color:#fff;border:0;padding:9px;border-radius:4px;">
      {% t "login.submit" %}
    </button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}
